<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <h1>📚 The Next Chaper</h1>
      <p class="subtitle">Tracking your path through every story.</p>
      <nav class="topnav">
        <a class="nav-link active" href="index.html">📚 Library</a>
        <a class="nav-link" href="statistics.html">📊 Statistics</a>
      </nav>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <div class="form-header">
          <h2>Add a book</h2>
          <button id="form-toggle" class="form-toggle" type="button" aria-expanded="true" aria-label="Collapse add form">▾</button>
        </div>
        <form id="add-form" class="add-form" autocomplete="off" novalidate>
          <label>
            Title <span class="req">*</span>
            <input type="text" name="title" maxlength="500" required />
          </label>
          <label>
            Author <span class="req">*</span>
            <input type="text" name="author" maxlength="300" required />
          </label>
          <label>
            Date
            <input type="date" name="date" />
          </label>
          <label>
            Type
            <select name="type">
              <option value="book">📖 Book</option>
              <option value="ebook">📱 eBook</option>
              <option value="audiobook">🎧 Audiobook</option>
            </select>
          </label>
          <label class="rating-label">
            Rating
            <select name="rating" id="rating-select" class="visually-hidden">
              <option value="">Unrated</option>
              <option value="0.5">½ (0.5)</option>
              <option value="1">★ (1)</option>
              <option value="1.5">★½ (1.5)</option>
              <option value="2">★★ (2)</option>
              <option value="2.5">★★½ (2.5)</option>
              <option value="3">★★★ (3)</option>
              <option value="3.5">★★★½ (3.5)</option>
              <option value="4">★★★★ (4)</option>
              <option value="4.5">★★★★½ (4.5)</option>
              <option value="5">★★★★★ (5)</option>
            </select>
            <div class="star-rating-input" id="star-rating-input" role="radiogroup" aria-label="Rating">
              <div class="star-input-wrapper" data-index="1">
                <span class="star-input-half left" data-value="0.5" role="radio" aria-checked="false" aria-label="0.5 stars"></span>
                <span class="star-input-half right" data-value="1.0" role="radio" aria-checked="false" aria-label="1 star"></span>
              </div>
              <div class="star-input-wrapper" data-index="2">
                <span class="star-input-half left" data-value="1.5" role="radio" aria-checked="false" aria-label="1.5 stars"></span>
                <span class="star-input-half right" data-value="2.0" role="radio" aria-checked="false" aria-label="2 stars"></span>
              </div>
              <div class="star-input-wrapper" data-index="3">
                <span class="star-input-half left" data-value="2.5" role="radio" aria-checked="false" aria-label="2.5 stars"></span>
                <span class="star-input-half right" data-value="3.0" role="radio" aria-checked="false" aria-label="3 stars"></span>
              </div>
              <div class="star-input-wrapper" data-index="4">
                <span class="star-input-half left" data-value="3.5" role="radio" aria-checked="false" aria-label="3.5 stars"></span>
                <span class="star-input-half right" data-value="4.0" role="radio" aria-checked="false" aria-label="4 stars"></span>
              </div>
              <div class="star-input-wrapper" data-index="5">
                <span class="star-input-half left" data-value="4.5" role="radio" aria-checked="false" aria-label="4.5 stars"></span>
                <span class="star-input-half right" data-value="5.0" role="radio" aria-checked="false" aria-label="5 stars"></span>
              </div>
              <button type="button" class="clear-rating-btn" id="clear-rating" title="Clear Rating" aria-label="Clear rating">✕</button>
            </div>
          </label>
          <label class="toggle-field">
            Status
            <span class="toggle-row">
              <input type="checkbox" name="dnf" id="dnf-toggle" class="toggle-input" />
              <span class="toggle-switch" aria-hidden="true"></span>
              <span class="toggle-state" id="dnf-state">Read</span>
            </span>
          </label>
          <label class="toggle-field">
            Spoilers
            <span class="toggle-row">
              <input type="checkbox" name="spoilers" id="spoilers-toggle" class="toggle-input toggle-spoilers" />
              <span class="toggle-switch" aria-hidden="true"></span>
              <span class="toggle-state" id="spoilers-state">Spoiler-free</span>
            </span>
          </label>
          <label class="full">
            Description
            <textarea name="description" rows="2" maxlength="5000"></textarea>
          </label>
          <div class="full add-form-actions">
            <button type="submit" class="primary">Add book</button>
            <p id="form-msg" class="form-msg" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="controls">
          <input
            type="search"
            id="search"
            class="search"
            placeholder="Search title, author, type or description…"
            aria-label="Search books"
          />
          <div class="view-toggle-wrap">
            <button id="btn-list-view" class="view-toggle-btn active" type="button" title="List View" aria-label="List View">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
            <button id="btn-grid-view" class="view-toggle-btn" type="button" title="Grid View" aria-label="Grid View">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
          </div>
        </div>

        <p id="count" class="count"></p>
        <p class="sort-hint">Tap a column heading to sort; tap it again to reverse.</p>

        <div class="table-wrap">
          <table id="book-table" class="book-table">
            <thead>
              <tr>
                <th data-key="title" scope="col">Title <span class="arrow"></span></th>
                <th data-key="author" scope="col">Author <span class="arrow"></span></th>
                <th data-key="type" scope="col">Type <span class="arrow"></span></th>
                <th data-key="date" scope="col">Date <span class="arrow"></span></th>
                <th data-key="rating" scope="col">Rating <span class="arrow"></span></th>
                <th data-key="dnf" scope="col">Status <span class="arrow"></span></th>
                <th data-key="spoilers" scope="col">Spoilers <span class="arrow"></span></th>
                <th scope="col">Description</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
              </tr>
              <tr class="filter-row">
                <td><input type="text" class="filter-input" data-filter="title" placeholder="Filter…" aria-label="Filter by title" /></td>
                <td><input type="text" class="filter-input" data-filter="author" placeholder="Filter…" aria-label="Filter by author" /></td>
                <td>
                  <select class="filter-input" data-filter="type" aria-label="Filter by type">
                    <option value="">All</option>
                    <option value="book">Book</option>
                    <option value="ebook">eBook</option>
                    <option value="audiobook">Audiobook</option>
                  </select>
                </td>
                <td><input type="text" class="filter-input" data-filter="date" placeholder="e.g. 2024" aria-label="Filter by date" /></td>
                <td>
                  <select class="filter-input" data-filter="rating" aria-label="Filter by rating">
                    <option value="">Any</option>
                    <option value="unrated">Unrated</option>
                    <option value="5">5</option>
                    <option value="4.5">4.5</option>
                    <option value="4">4</option>
                    <option value="3.5">3.5</option>
                    <option value="3">3</option>
                    <option value="2.5">2.5</option>
                    <option value="2">2</option>
                    <option value="1.5">1.5</option>
                    <option value="1">1</option>
                    <option value="0.5">0.5</option>
                  </select>
                </td>
                <td>
                  <select class="filter-input" data-filter="dnf" aria-label="Filter by status">
                    <option value="">All</option>
                    <option value="read">Read</option>
                    <option value="dnf">DNF</option>
                  </select>
                </td>
                <td>
                  <select class="filter-input" data-filter="spoilers" aria-label="Filter by spoilers">
                    <option value="">All</option>
                    <option value="free">Spoiler-free</option>
                    <option value="spoilers">Spoilers</option>
                  </select>
                </td>
                <td><input type="text" class="filter-input" data-filter="description" placeholder="Filter…" aria-label="Filter by description" /></td>
                <td class="filter-clear-cell"><button id="clear-filters" class="filter-clear" type="button" title="Clear all filters" aria-label="Clear all filters">✕</button></td>
              </tr>
            </thead>
            <tbody id="tbody" aria-live="polite"></tbody>
          </table>
        </div>
        <p id="empty" class="empty hidden">No books yet. Add your first one!</p>

        <div id="pagination" class="pagination hidden">
          <button id="prev-page" class="ghost" type="button">‹ Prev</button>
          <span id="page-info" class="page-info"></span>
          <button id="next-page" class="ghost" type="button">Next ›</button>
        </div>
      </section>
    </main>

    <div id="detail-backdrop" class="detail-backdrop hidden"></div>

    <!-- Detail drawer lives at body level so its position:fixed escapes the
         .panel backdrop-filter containing block (otherwise the backdrop would
         render on top of it and the content would look blurry/empty). -->
    <div id="detail" class="detail hidden" aria-live="polite">
      <button class="detail-close" type="button" aria-label="Close details">✕</button>

      <div class="detail-view">
        <span class="type-badge detail-type"></span>
        <h3 class="detail-title"></h3>
        <div class="detail-author"></div>
        <div class="detail-meta">
          <span class="detail-date"></span>
          <span class="detail-rating"></span>
          <span class="detail-status"></span>
          <span class="detail-spoilers"></span>
        </div>
        <p class="detail-desc"></p>
        <div class="detail-actions">
          <button class="detail-edit" type="button">Edit</button>
          <button class="detail-delete" type="button">Delete book</button>
        </div>
      </div>

      <form class="detail-edit-form hidden" id="detail-edit-form" autocomplete="off" novalidate>
        <h3 class="detail-edit-title">Edit book</h3>
        <label>
          Title <span class="req">*</span>
          <input type="text" name="title" maxlength="500" required />
        </label>
        <label>
          Author <span class="req">*</span>
          <input type="text" name="author" maxlength="300" required />
        </label>
        <div class="row">
          <label>
            Date
            <input type="date" name="date" />
          </label>
          <label>
            Type
            <select name="type">
              <option value="book">📖 Book</option>
              <option value="ebook">📱 eBook</option>
              <option value="audiobook">🎧 Audiobook</option>
            </select>
          </label>
        </div>
        <label>
          Rating
          <select name="rating">
            <option value="">Unrated</option>
            <option value="0.5">½ (0.5)</option>
            <option value="1">★ (1)</option>
            <option value="1.5">★½ (1.5)</option>
            <option value="2">★★ (2)</option>
            <option value="2.5">★★½ (2.5)</option>
            <option value="3">★★★ (3)</option>
            <option value="3.5">★★★½ (3.5)</option>
            <option value="4">★★★★ (4)</option>
            <option value="4.5">★★★★½ (4.5)</option>
            <option value="5">★★★★★ (5)</option>
          </select>
        </label>
        <label class="toggle-field">
          Status
          <span class="toggle-row">
            <input type="checkbox" name="dnf" id="edit-dnf" class="toggle-input" />
            <span class="toggle-switch" aria-hidden="true"></span>
            <span class="toggle-state" id="edit-dnf-state">Read</span>
          </span>
        </label>
        <label class="toggle-field">
          Spoilers
          <span class="toggle-row">
            <input type="checkbox" name="spoilers" id="edit-spoilers" class="toggle-input toggle-spoilers" />
            <span class="toggle-switch" aria-hidden="true"></span>
            <span class="toggle-state" id="edit-spoilers-state">Spoiler-free</span>
          </span>
        </label>
        <label>
          Description
          <textarea name="description" rows="4" maxlength="5000"></textarea>
        </label>
        <div class="detail-actions">
          <button type="submit" class="primary">Save changes</button>
          <button type="button" class="detail-cancel ghost">Cancel</button>
        </div>
        <p class="detail-edit-msg form-msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <script src="app.js?v=16" type="module"></script>
  </body>
</html>
